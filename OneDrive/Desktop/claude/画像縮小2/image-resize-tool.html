<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>画像リサイズツール</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 50%, #f1f5f9 100%);
            padding: 20px;
            color: #333;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08), 0 0 0 1px rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        h1 {
            text-align: center;
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #64748b 0%, #475569 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 40px;
            letter-spacing: -0.02em;
        }
        
        .upload-area {
            position: relative;
            border: 2px dashed rgba(148, 163, 184, 0.4);
            border-radius: 20px;
            padding: 60px 40px;
            text-align: center;
            margin-bottom: 30px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: linear-gradient(135deg, rgba(248, 250, 252, 0.8) 0%, rgba(241, 245, 249, 0.8) 100%);
            overflow: hidden;
        }
        
        .upload-area::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(226, 232, 240, 0.3) 0%, rgba(203, 213, 225, 0.3) 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .upload-area:hover::before {
            opacity: 1;
        }
        
        .upload-area:hover {
            border-color: rgba(100, 116, 139, 0.6);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(100, 116, 139, 0.15);
        }
        
        .upload-area.dragover {
            border-color: #64748b;
            background: linear-gradient(135deg, rgba(226, 232, 240, 0.4) 0%, rgba(203, 213, 225, 0.4) 100%);
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(100, 116, 139, 0.2);
        }
        
        .upload-area p {
            font-size: 1.2rem;
            color: #64748b;
            font-weight: 500;
            position: relative;
            z-index: 2;
        }
        
        #fileInput {
            display: none;
        }
        
        .controls {
            display: none;
            margin-top: 30px;
            animation: fadeInUp 0.6s ease-out;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .control-group {
            margin-bottom: 30px;
            padding: 25px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
        }
        
        label {
            display: block;
            margin-bottom: 12px;
            font-weight: 600;
            font-size: 0.95rem;
            color: #4a5568;
            letter-spacing: 0.025em;
        }
        
        input[type="range"] {
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: #e2e8f0;
            outline: none;
            margin: 15px 0;
            -webkit-appearance: none;
            position: relative;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: linear-gradient(135deg, #64748b 0%, #475569 100%);
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(100, 116, 139, 0.3);
            transition: all 0.2s ease;
        }
        
        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(100, 116, 139, 0.4);
        }
        
        input[type="range"]::-moz-range-thumb {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: linear-gradient(135deg, #64748b 0%, #475569 100%);
            cursor: pointer;
            border: none;
            box-shadow: 0 4px 12px rgba(100, 116, 139, 0.3);
        }
        
        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            margin-right: 12px;
            accent-color: #64748b;
            cursor: pointer;
        }
        
        .size-display {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }
        
        .size-info {
            background: linear-gradient(135deg, rgba(248, 250, 252, 0.8) 0%, rgba(241, 245, 249, 0.8) 100%);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid rgba(203, 213, 225, 0.3);
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        .size-info::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #64748b 0%, #475569 100%);
        }
        
        .size-info strong {
            display: block;
            font-size: 1.1rem;
            font-weight: 600;
            color: #4a5568;
            margin-bottom: 8px;
        }
        
        .preview-container {
            margin-top: 30px;
            text-align: center;
        }
        
        .preview-images {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-top: 20px;
        }
        
        .preview-item {
            border-radius: 16px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .preview-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
        }
        
        .preview-item img, .preview-item canvas {
            width: 100%;
            height: auto;
            display: block;
        }
        
        .preview-label {
            padding: 15px 20px;
            background: linear-gradient(135deg, rgba(226, 232, 240, 0.5) 0%, rgba(203, 213, 225, 0.5) 100%);
            font-size: 0.9rem;
            font-weight: 500;
            color: #4a5568;
            text-align: center;
        }
        
        button {
            background: linear-gradient(135deg, #64748b 0%, #475569 100%);
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(100, 116, 139, 0.3);
            position: relative;
            overflow: hidden;
        }
        
        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }
        
        button:hover::before {
            left: 100%;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(100, 116, 139, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .download-area {
            text-align: center;
            margin-top: 40px;
            padding: 30px;
            background: linear-gradient(135deg, rgba(248, 250, 252, 0.6) 0%, rgba(241, 245, 249, 0.6) 100%);
            border-radius: 20px;
            border: 1px solid rgba(203, 213, 225, 0.3);
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 20px;
                border-radius: 20px;
            }
            
            .size-display {
                grid-template-columns: 1fr;
                gap: 15px;
            }
            
            .preview-images {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            
            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>画像リサイズツール</h1>
        
        <div class="upload-area" id="uploadArea">
            <p>画像をここにドラッグ&ドロップするか、クリックして選択してください</p>
            <input type="file" id="fileInput" accept="image/*">
        </div>

        <div class="controls" id="controls">
            <div class="size-display">
                <div class="size-info">
                    <strong>元の画像</strong><br>
                    サイズ: <span id="originalSize">-</span><br>
                    ファイルサイズ: <span id="originalFileSize">-</span>
                </div>
                <div class="size-info">
                    <strong>リサイズ後</strong><br>
                    サイズ: <span id="resizedSize">-</span><br>
                    推定ファイルサイズ: <span id="resizedFileSize">-</span>
                </div>
            </div>

            <div class="control-group">
                <label for="widthSlider">幅: <span id="widthValue">800</span>px</label>
                <input type="range" id="widthSlider" min="50" max="2000" value="800">
                <label>
                    <input type="checkbox" id="keepAspectRatio" checked> 縦横比を維持
                </label>
            </div>

            <div class="control-group">
                <label for="heightSlider">高さ: <span id="heightValue">600</span>px</label>
                <input type="range" id="heightSlider" min="50" max="2000" value="600">
            </div>

            <div class="control-group">
                <label for="qualitySlider">画質: <span id="qualityValue">85</span>%</label>
                <input type="range" id="qualitySlider" min="10" max="100" value="85">
            </div>

            <div class="preview-container">
                <div class="preview-images" id="previewImages">
                    <div class="preview-item">
                        <img id="originalPreview" alt="元の画像">
                        <div class="preview-label">元の画像</div>
                    </div>
                    <div class="preview-item">
                        <canvas id="resizedCanvas"></canvas>
                        <div class="preview-label">リサイズ後</div>
                    </div>
                </div>
            </div>

            <div class="download-area">
                <button id="downloadBtn">リサイズした画像をダウンロード</button>
            </div>
        </div>
    </div>

    <script>
        let originalImage = null;
        let originalFileName = '';

        const fileInput = document.getElementById('fileInput');
        const uploadArea = document.getElementById('uploadArea');
        const controls = document.getElementById('controls');
        const originalPreview = document.getElementById('originalPreview');
        const resizedCanvas = document.getElementById('resizedCanvas');
        const ctx = resizedCanvas.getContext('2d');

        const widthSlider = document.getElementById('widthSlider');
        const heightSlider = document.getElementById('heightSlider');
        const qualitySlider = document.getElementById('qualitySlider');
        const keepAspectRatio = document.getElementById('keepAspectRatio');

        const widthValue = document.getElementById('widthValue');
        const heightValue = document.getElementById('heightValue');
        const qualityValue = document.getElementById('qualityValue');

        const originalSize = document.getElementById('originalSize');
        const originalFileSize = document.getElementById('originalFileSize');
        const resizedSize = document.getElementById('resizedSize');
        const resizedFileSize = document.getElementById('resizedFileSize');

        const downloadBtn = document.getElementById('downloadBtn');

        uploadArea.addEventListener('click', () => fileInput.click());

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        function handleFile(file) {
            if (!file.type.startsWith('image/')) {
                alert('画像ファイルを選択してください。');
                return;
            }

            originalFileName = file.name;
            const reader = new FileReader();
            
            reader.onload = (e) => {
                originalImage = new Image();
                originalImage.onload = () => {
                    setupImage(file);
                };
                originalImage.src = e.target.result;
                originalPreview.src = e.target.result;
            };
            
            reader.readAsDataURL(file);
        }

        function setupImage(file) {
            controls.style.display = 'block';
            
            originalSize.textContent = `${originalImage.width} × ${originalImage.height}px`;
            originalFileSize.textContent = formatFileSize(file.size);

            widthSlider.max = originalImage.width * 2;
            heightSlider.max = originalImage.height * 2;
            
            widthSlider.value = Math.min(800, originalImage.width);
            heightSlider.value = Math.min(600, originalImage.height);

            updatePreview();
            setupEventListeners();
        }

        function setupEventListeners() {
            widthSlider.addEventListener('input', (e) => {
                widthValue.textContent = e.target.value;
                if (keepAspectRatio.checked) {
                    const ratio = originalImage.height / originalImage.width;
                    const newHeight = Math.round(e.target.value * ratio);
                    heightSlider.value = newHeight;
                    heightValue.textContent = newHeight;
                }
                updatePreview();
            });

            heightSlider.addEventListener('input', (e) => {
                heightValue.textContent = e.target.value;
                if (keepAspectRatio.checked) {
                    const ratio = originalImage.width / originalImage.height;
                    const newWidth = Math.round(e.target.value * ratio);
                    widthSlider.value = newWidth;
                    widthValue.textContent = newWidth;
                }
                updatePreview();
            });

            qualitySlider.addEventListener('input', (e) => {
                qualityValue.textContent = e.target.value;
                updatePreview();
            });

            keepAspectRatio.addEventListener('change', () => {
                if (keepAspectRatio.checked) {
                    const ratio = originalImage.height / originalImage.width;
                    const newHeight = Math.round(widthSlider.value * ratio);
                    heightSlider.value = newHeight;
                    heightValue.textContent = newHeight;
                    updatePreview();
                }
            });

            downloadBtn.addEventListener('click', downloadImage);
        }

        function updatePreview() {
            const newWidth = parseInt(widthSlider.value);
            const newHeight = parseInt(heightSlider.value);
            const quality = parseInt(qualitySlider.value) / 100;

            resizedCanvas.width = newWidth;
            resizedCanvas.height = newHeight;
            
            ctx.clearRect(0, 0, newWidth, newHeight);
            ctx.drawImage(originalImage, 0, 0, newWidth, newHeight);

            resizedSize.textContent = `${newWidth} × ${newHeight}px`;
            
            resizedCanvas.toBlob((blob) => {
                if (blob) {
                    resizedFileSize.textContent = formatFileSize(blob.size);
                }
            }, 'image/jpeg', quality);
        }

        function downloadImage() {
            const quality = parseInt(qualitySlider.value) / 100;
            const canvas = resizedCanvas;
            
            canvas.toBlob((blob) => {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                const fileName = originalFileName.replace(/\.[^/.]+$/, '') + '_resized.jpg';
                
                a.href = url;
                a.download = fileName;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }, 'image/jpeg', quality);
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }
    </script>
</body>
</html>
